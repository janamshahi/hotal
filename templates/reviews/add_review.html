{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Review {{ room.name }} | GrandStay Hotel
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f7f7f2;
        }

        .review-card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
        }

        .star-rating input {
            display: none;
        }

        .star-rating label {
            font-size: 2.5rem;
            color: #ccc;
            cursor: pointer;
        }

        .star-rating label:hover,
        .star-rating label:hover ~ label,
        .star-rating input:checked ~ label {
            color: #d5b300;
        }

        .btn-main {
            background: #b8b63b;
            color: white;
            border: none;
            padding: 12px;
        }

        .btn-main:hover {
            background: #9e9c2e;
            color: white;
        }

    </style>

</head>


<body>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="review-card">

                <a
                    href="{% url 'room_detail' room.id %}"
                    class="text-decoration-none text-secondary"
                >

                    <i class="bi bi-arrow-left"></i>

                    Back to Room

                </a>


                <div class="text-center mt-4">

                    {% if room.image %}

                        <img
                            src="{{ room.image.url }}"
                            class="rounded-4 mb-3"
                            style="
                                width:180px;
                                height:120px;
                                object-fit:cover;
                            "
                            alt="{{ room.name }}"
                        >

                    {% endif %}


                    <h2 class="fw-bold">
                        Review {{ room.name }}
                    </h2>

                    <p class="text-muted">
                        Share your experience with us.
                    </p>

                </div>


                {% if messages %}

                    {% for message in messages %}

                        <div class="alert alert-{{ message.tags }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}


                <form method="POST">

                    {% csrf_token %}


                    <label class="form-label fw-semibold">
                        Your Rating
                    </label>


                    <div class="star-rating mb-4">

                        <input
                            type="radio"
                            id="star5"
                            name="rating"
                            value="5"
                        >

                        <label for="star5">
                            ★
                        </label>


                        <input
                            type="radio"
                            id="star4"
                            name="rating"
                            value="4"
                        >

                        <label for="star4">
                            ★
                        </label>


                        <input
                            type="radio"
                            id="star3"
                            name="rating"
                            value="3"
                        >

                        <label for="star3">
                            ★
                        </label>


                        <input
                            type="radio"
                            id="star2"
                            name="rating"
                            value="2"
                        >

                        <label for="star2">
                            ★
                        </label>


                        <input
                            type="radio"
                            id="star1"
                            name="rating"
                            value="1"
                        >

                        <label for="star1">
                            ★
                        </label>

                    </div>


                    <label class="form-label fw-semibold">
                        Your Review
                    </label>

                    <textarea
                        name="comment"
                        class="form-control"
                        rows="6"
                        placeholder="Tell us about your experience..."
                        required
                    ></textarea>


                    <button
                        type="submit"
                        class="btn btn-main w-100 mt-4"
                    >

                        <i class="bi bi-star-fill me-2"></i>

                        Submit Review

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


</body>
</html>
