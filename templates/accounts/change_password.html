<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Change Password | GrandStay Hotel</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <style>

        body {
            background: #f5f5f5;
            font-family: "Poppins", sans-serif;
        }

        .password-wrapper {
            max-width: 550px;
            margin: 80px auto;
        }

        .password-card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        h2 {
            font-weight: 700;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
        }

        .form-control {
            min-height: 50px;
            border-radius: 8px;
        }

        .btn-gold {
            background: #b38b59;
            color: white;
            border: none;
        }

        .btn-gold:hover {
            background: #8f6c43;
            color: white;
        }

        .helptext {
            font-size: 11px;
            color: #888;
        }

        ul {
            font-size: 12px;
            color: #777;
        }

    </style>

</head>


<body>


<div class="container password-wrapper">


    <div class="password-card">


        <div class="text-center mb-4">

            <h2>
                Change Password
            </h2>

            <p class="text-muted">
                Keep your account secure.
            </p>

        </div>


        <form method="POST">

            {% csrf_token %}


            {% if form.errors %}

                <div class="alert alert-danger">

                    Please correct the errors below.

                </div>

            {% endif %}


            {% for field in form %}


                <div class="mb-3">


                    <label class="form-label">

                        {{ field.label }}

                    </label>


                    {{ field }}


                    {% if field.help_text %}

                        <div class="helptext">

                            {{ field.help_text }}

                        </div>

                    {% endif %}


                    {% for error in field.errors %}

                        <div
                            class="text-danger"
                            style="font-size:12px;">

                            {{ error }}

                        </div>

                    {% endfor %}


                </div>


            {% endfor %}


            <button
                type="submit"
                class="btn btn-gold">

                Change Password

            </button>


            <a
                href="{% url 'profile' %}"
                class="btn btn-outline-secondary">

                Cancel

            </a>


        </form>


    </div>


</div>


</body>

</html>
